version: 2

models:
  - name: stg_gtfs__routes
    description: "Cleaned GTFS route records."
    columns:
      - name: route_id
        description: "Unique identifier for each route."
        data_tests:
          - not_null
          - unique

  - name: stg_gtfs__stops
    description: "Cleaned GTFS stop and station records."
    columns:
      - name: stop_id
        description: "Unique identifier for each stop or station."
        data_tests:
          - not_null
          - unique

  - name: stg_gtfs__trips
    description: "Cleaned GTFS trip records."
    columns:
      - name: trip_id
        description: "Unique identifier for each trip."
        data_tests:
          - not_null
          - unique

      - name: route_id
        description: "Route associated with the trip."
        data_tests:
          - not_null

  - name: stg_gtfs__stop_times
    description: "Cleaned GTFS scheduled stop-time records."
    columns:
      - name: trip_id
        description: "Trip associated with the scheduled stop event."
        data_tests:
          - not_null

      - name: stop_id
        description: "Stop associated with the scheduled stop event."
        data_tests:
          - not_null

      - name: stop_sequence
        description: "Sequence number of the stop within the trip."
        data_tests:
          - not_null

  - name: stg_gtfs__calendar
    description: "Regular GTFS service calendars."
    columns:
      - name: service_id
        data_tests:
          - not_null
          - unique
      - name: start_date
        data_tests:
          - not_null
      - name: end_date
        data_tests:
          - not_null

  - name: stg_gtfs__calendar_dates
    description: "GTFS service-date additions and removals."
    columns:
      - name: service_id
        data_tests:
          - not_null
      - name: service_date
        data_tests:
          - not_null
      - name: exception_type
        data_tests:
          - not_null

  - name: stg_service_quality__indicators
    description: "Cleaned quarterly public-transport service-quality indicators."
    columns:
      - name: operator
        description: "Transport operator responsible for the reported indicator."
        data_tests:
          - not_null

      - name: theme
        description: "Service-quality theme, such as passenger information or accessibility."
        data_tests:
          - not_null

      - name: indicator
        description: "Name of the service-quality indicator."
        data_tests:
          - not_null

      - name: mode
        description: "Transport mode associated with the indicator."
        data_tests:
          - not_null

      - name: quarter
        description: "Reporting quarter."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['T1', 'T2', 'T3', 'T4']

      - name: year
        description: "Reporting year."
        data_tests:
          - not_null

      - name: result_percentage
        description: "Reported indicator result as a percentage; may be missing."

      - name: result_occurrence
        description: "Reported indicator result as an occurrence count; may be missing."

      - name: penalty
        description: "Penalty status reported by the source."

